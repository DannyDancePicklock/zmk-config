# Blackbox: mitschreiben ohne Kabel, auslesen per USB/PuTTY
CONFIG_BT_REMOTE_BLACKBOX=y

# Live-Diagnose wie im DIAGNOSE-Build (sichtbar, wenn USB steckt)
CONFIG_BT_REMOTE_DIAG=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
