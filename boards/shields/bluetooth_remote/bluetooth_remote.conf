CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_REMOTE_STATUS_LED=y

# Aeltere Intel-Bluetooth-Chips (z. B. 8087:0A2A) koppeln nicht mit 2-Mbit-PHY
CONFIG_BT_CTLR_PHY_2M=n

# Kopplungsmodus nur per Kombi (Play + Lauter 2 s), Abbruch mit Play
CONFIG_BT_REMOTE_PAIRING_WINDOW=y

# Takt-Toleranz: Remote rechnet mit ungenauerem 32-kHz-Takt (500 statt 50 ppm)
# und hoert dadurch bei jedem Funk-Termin etwas laenger hin. Hilft, wenn der PC
# beim ersten Kontakt einen langsamen Takt (z. B. 60 ms) vorgibt.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Kanalwahl: nur die alte Formel (CSA #1) anbieten. Test gegen Intel-Chips,
# bei denen die Remote nach dem Verbinden nie das erste Paket hoert.
CONFIG_BT_CTLR_CHAN_SEL_2=n

# Sendeleistung auf Maximum (+8 dBm statt 0 dBm). Der Saal-PC hoert die
# Remote auf 15 m zu schlecht (Wireshark + Blackbox vom 25.10.).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# TESTPHASE: LED-Ampel - rot dauerhaft, solange nicht verbunden.
# Fuer die Serie wieder rausnehmen (kostet Akku).
CONFIG_BT_REMOTE_STATUS_LED_DEBUG=y
