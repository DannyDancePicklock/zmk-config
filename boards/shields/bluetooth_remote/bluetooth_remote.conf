CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_REMOTE_STATUS_LED=y

# Aeltere Intel-Bluetooth-Chips (z. B. 8087:0A2A) koppeln nicht mit 2-Mbit-PHY
CONFIG_BT_CTLR_PHY_2M=n

# Kopplungsmodus nur per Kombi (Play + Lauter 2 s), Abbruch mit Play
CONFIG_BT_REMOTE_PAIRING_WINDOW=y

# TEST: interner RC-Taktgeber statt 32-kHz-Quarz (umgeht einen evtl. ungenauen
# Quarz auf dem SuperMini-Klon). Braucht etwas mehr Strom. Zum Zuruecksetzen
# diese Zeile entfernen.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
