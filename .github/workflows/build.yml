name: Build ZMK firmware
# Eigene Kopie von zmkfirmware/zmk build-user-config.yml (v0.3) mit einem
# zusaetzlichen Schritt: ZMK wird gepatcht, damit die Remote auch die aeltere
# Bluetooth-Kopplung ("Legacy Pairing") akzeptiert. Noetig fuer alte
# Bluetooth-Chips wie Intel 7265/3165 (8087:0A2A).
on: [push, pull_request, workflow_dispatch]

env:
  BUILD_MATRIX_PATH: build.yaml
  CONFIG_PATH: config
  FALLBACK_BINARY: bin
  ARCHIVE_NAME: firmware

jobs:
  matrix:
    runs-on: ubuntu-22.04
    name: Fetch Build Keyboards
    outputs:
      build_matrix: ${{ env.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Build Matrix
        run: |
          echo "build_matrix=$(yq -oj -I0 '${{ env.BUILD_MATRIX_PATH }}')" >> $GITHUB_ENV
          yq -oj "${{ env.BUILD_MATRIX_PATH }}"

  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    needs: matrix
    name: Build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: |
          echo "build_dir=$(mktemp -d)" >> $GITHUB_ENV

      - name: Prepare variables
        shell: sh -x {0}
        env:
          board: ${{ matrix.board }}
          shield: ${{ matrix.shield }}
          artifact_name: ${{ matrix.artifact-name }}
          snippet: ${{ matrix.snippet }}
        run: |
          if [ -e zephyr/module.yml ]; then
            export zmk_load_arg=" -DZMK_EXTRA_MODULES='${GITHUB_WORKSPACE}'"
            new_tmp_dir="${TMPDIR:-/tmp}/zmk-config"
            mkdir -p "${new_tmp_dir}"
            echo "base_dir=${new_tmp_dir}" >> $GITHUB_ENV
          else
            echo "base_dir=${GITHUB_WORKSPACE}" >> $GITHUB_ENV
          fi

          if [ -n "${snippet}" ]; then
            extra_west_args="-S \"${snippet}\""
          fi

          echo "zephyr_version=${ZEPHYR_VERSION}" >> $GITHUB_ENV
          echo "extra_west_args=${extra_west_args}" >> $GITHUB_ENV
          echo "extra_cmake_args=${shield:+-DSHIELD=\"$shield\"}${zmk_load_arg}" >> $GITHUB_ENV
          echo "display_name=${shield:+$shield - }${board}" >> $GITHUB_ENV
          echo "artifact_name=${artifact_name:-${shield:+$shield-}${board}-zmk}" >> $GITHUB_ENV

      - name: Copy config files to isolated temporary directory
        run: |
          if [ "${{ env.base_dir }}" != "${GITHUB_WORKSPACE}" ]; then
            mkdir "${{ env.base_dir }}/${{ env.CONFIG_PATH }}"
            cp -R ${{ env.CONFIG_PATH }}/* "${{ env.base_dir }}/${{ env.CONFIG_PATH }}/"
          fi

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-zephyr-${{ env.zephyr_version }}-modules
        with:
          path: |
            ${{ env.base_dir }}/modules/
            ${{ env.base_dir }}/tools/
            ${{ env.base_dir }}/zephyr/
            ${{ env.base_dir }}/bootloader/
            ${{ env.base_dir }}/zmk/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('**/west.yml', '**/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Reset cached ZMK checkout
        working-directory: ${{ env.base_dir }}
        run: |
          if [ -d zmk/.git ]; then git -C zmk checkout -- . ; fi

      - name: West Init
        working-directory: ${{ env.base_dir }}
        run: west init -l "${{ env.base_dir }}/${{ env.CONFIG_PATH }}"

      - name: West Update
        working-directory: ${{ env.base_dir }}
        run: west update --fetch-opt=--filter=tree:0

      - name: Patch ZMK - Kopplungsmodus und Legacy Pairing
        working-directory: ${{ env.base_dir }}
        run: |
          # 1) Kopplungsmodus nur per Kombi (Hook im ZMK-Advertising)
          git -C zmk apply --verbose "${GITHUB_WORKSPACE}/patches/zmk-v0.3-pairing-window.patch"
          grep -q "zmk_ble_open_profile_adv_allowed" zmk/app/src/ble.c || { echo "Pairing-Patch fehlt"; exit 1; }
          # 2) Legacy Pairing erlauben (alte Bluetooth-Chips)
          sed -i '/select BT_SMP_SC_PAIR_ONLY/d' zmk/app/Kconfig
          if grep -q "select BT_SMP_SC_PAIR_ONLY" zmk/app/Kconfig; then
            echo "Patch fehlgeschlagen" && exit 1
          fi
          echo "BT_SMP_SC_PAIR_ONLY aus ZMK entfernt"

      - name: West Zephyr export
        working-directory: ${{ env.base_dir }}
        run: west zephyr-export

      - name: West Build (${{ env.display_name }})
        working-directory: ${{ env.base_dir }}
        shell: sh -x {0}
        run: |
          # Ausgabe mitschneiden, damit Compilerfehler als Hinweis im Build erscheinen
          if ! west build -s zmk/app -d "${{ env.build_dir }}" -b "${{ matrix.board }}" ${{ env.extra_west_args }} -- -DZMK_CONFIG=${{ env.base_dir }}/${{ env.CONFIG_PATH }} ${{ env.extra_cmake_args }} ${{ matrix.cmake-args }} > build.log 2>&1; then
            cat build.log
            grep -E "error|Error|undefined reference|warning: " build.log | grep -v "^--" | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat build.log
          grep -E "warning: " build.log | grep -E "pairing|status_led|behavior_pairing|ble\.c" | head -10 | while IFS= read -r line; do echo "::warning::$line"; done

      - name: Check Legacy Pairing aktiv
        run: |
          if grep -q "^CONFIG_BT_SMP_SC_PAIR_ONLY=y" "${{ env.build_dir }}/zephyr/.config"; then
            echo "SC_PAIR_ONLY ist noch aktiv" && exit 1
          fi
          echo "Legacy Pairing erlaubt"
          for k in BT_DEVICE_NAME BT_SMP_SC_PAIR_ONLY BT_CTLR_PHY_2M BT_REMOTE_PAIRING_WINDOW CLOCK_CONTROL_NRF_K32SRC_RC CLOCK_CONTROL_NRF_K32SRC_XTAL CLOCK_CONTROL_NRF_ACCURACY CLOCK_CONTROL_NRF_CALIBRATION; do
            v=$(grep -E "^(# )?CONFIG_${k}[= ]" "${{ env.build_dir }}/zephyr/.config" | head -1)
            echo "::notice title=${k}::${v:-nicht gesetzt}"
          done

      - name: Check Kopplungsmodus-Code in der Firmware
        run: |
          cfg="${{ env.build_dir }}/zephyr/.config"
          elf="${{ env.build_dir }}/zephyr/zmk.elf"
          [ -f "$elf" ] || elf="${{ env.build_dir }}/zephyr/zephyr.elf"
          echo "::notice title=ELF::$elf"
          if ! grep -q "^CONFIG_BT_REMOTE_PAIRING_WINDOW=y" "$cfg"; then
            echo "Kopplungsmodus-Modul nicht aktiv in diesem Build, Pruefung uebersprungen"; exit 0
          fi
          NM=$(command -v arm-zephyr-eabi-nm || find / -name "arm-zephyr-eabi-nm" -type f 2>/dev/null | head -1)
          if [ -z "$NM" ]; then echo "::error::nm nicht gefunden"; exit 1; fi
          ok=1
          for sym in zmk_ble_open_profile_adv_allowed bt_remote_pairing_start bt_remote_pairing_cancel bt_remote_status_led_refresh; do
            line=$("$NM" "$elf" | grep " ${sym}$" | head -1)
            echo "::notice title=${sym}::${line:-FEHLT}"
            [ -n "$line" ] || ok=0
          done
          # T = vom Modul ueberschrieben, W = noch der schwache ZMK-Standard
          if ! "$NM" "$elf" | grep -q " T zmk_ble_open_profile_adv_allowed$"; then
            echo "::error::Hook ist nicht durch das Modul ueberschrieben"; ok=0
          fi
          if grep -a -q "pairing_start" "$elf"; then
            echo "::notice title=Behavior::pairing_start ist in der Firmware"
          else
            echo "::error::Behavior pairing_start fehlt in der Firmware"; ok=0
          fi
          [ "$ok" = 1 ]

      - name: ${{ env.display_name }} Kconfig file
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/.config" ]
          then
            grep -v -e "^#" -e "^$" "${{ env.build_dir }}/zephyr/.config" | sort
          else
            echo "No Kconfig output"
          fi
        if: ${{ !cancelled() }}

      - name: ${{ env.display_name }} Devicetree file
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/zephyr.dts" ]
          then
            cat "${{ env.build_dir }}/zephyr/zephyr.dts"
          elif [ -f "${{ env.build_dir }}/zephyr/zephyr.dts.pre" ]
          then
            cat -s "${{ env.build_dir }}/zephyr/zephyr.dts.pre"
          else
            echo "No Devicetree output"
          fi
        if: ${{ !cancelled() }}

      - name: Rename artifacts
        shell: sh -x {0}
        run: |
          mkdir "${{ env.build_dir }}/artifacts"
          if [ -f "${{ env.build_dir }}/zephyr/zmk.uf2" ]
          then
            cp "${{ env.build_dir }}/zephyr/zmk.uf2" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.uf2"
          elif [ -f "${{ env.build_dir }}/zephyr/zmk.${{ env.FALLBACK_BINARY }}" ]
          then
            cp "${{ env.build_dir }}/zephyr/zmk.${{ env.FALLBACK_BINARY }}" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.${{ env.FALLBACK_BINARY }}"
          fi

      - name: Archive (${{ env.display_name }})
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ env.artifact_name }}
          path: ${{ env.build_dir }}/artifacts

  merge:
    runs-on: ubuntu-latest
    needs: build
    name: Merge Output Artifacts
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          pattern: artifact-*
          delete-merged: true
